name: Publish Manga Translator

# 觸發條件：原始碼有變動推到 main，或手動執行（可強制發布）
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/manga-translator/**'
      - 'tools/**'
      - '.github/workflows/publish-manga-translator.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '即使 catalog 已有相同或更新版本，也強制發布'
        type: boolean
        default: false

permissions:
  contents: write        # 建立 Release、上傳 APK、更新 catalog.json

concurrency:
  group: publish-manga-translator
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      # 正式簽章金鑰：存在 GitHub Secrets（MANGA_KEYSTORE_BASE64），不進版控
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::尚未設定 repository secret MANGA_KEYSTORE_BASE64（漫畫翻譯的簽章金鑰）"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          echo "金鑰憑證："
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -i androiddebugkey

      - name: Unit tests
        working-directory: apps/manga-translator
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK
        working-directory: apps/manga-translator
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verify APK signature
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=apps/manga-translator/app/build/outputs/apk/debug/app-debug.apk
          aapt2 dump badging "$APK" | head -1
          apksigner verify --print-certs "$APK" | sed -n '2p'

      - name: Check version against catalog
        id: guard
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=apps/manga-translator/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/ci_guard.py --apk "$APK" --catalog catalog.json ${{ inputs.force && '--force' || '' }}

      - name: Create release and update catalog
        if: steps.guard.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=apps/manga-translator/app/build/outputs/apk/debug/app-debug.apk
          NOTES="由 GitHub Actions 自動建置並發布（commit ${GITHUB_SHA::7}）"
          python3 tools/publish.py --config tools/config.json --apk "$APK" --notes "$NOTES" --yes

      - name: Summary
        if: always()
        run: |
          echo "### 漫畫翻譯發布結果" >> $GITHUB_STEP_SUMMARY
          echo "- 版本判斷：${{ steps.guard.outputs.reason || '（未執行到版本檢查）' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 是否發布：${{ steps.guard.outputs.publish || 'false' }}" >> $GITHUB_STEP_SUMMARY

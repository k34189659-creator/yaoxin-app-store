name: Publish Manga Translator

# push：只做編譯、簽署驗證與版本檢查（不上架）
# 手動執行：勾選 publish 才會真正建立 Release 並更新 catalog.json
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/manga-translator/**'
      - 'tools/**'
      - '.github/workflows/publish-manga-translator.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: '真正發布（建立 Release、更新 catalog.json）'
        type: boolean
        default: false
      force:
        description: '即使 catalog 已有相同或更新版本，也強制發布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-manga-translator
  cancel-in-progress: false

env:
  EXPECTED_SIGNER: e81d2eb27ec26af5d90151e065cab45a4efd20181977dab765ba84738a99d9e8
  APK: apps/manga-translator/app/build/outputs/apk/debug/app-debug.apk

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # 簽章金鑰來自 Secret；尚未設定時仍可編譯（以臨時金鑰簽署，只作編譯驗證，不會發布）
      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::尚未設定 secret MANGA_KEYSTORE_BASE64；本次以臨時金鑰簽署，只驗證編譯，不允許發布"
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -qi androiddebugkey
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Unit tests
        working-directory: apps/manga-translator
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK
        working-directory: apps/manga-translator
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      # 硬性比對完整指紋：不一致就讓 workflow 失敗
      - name: Verify APK signer fingerprint
        id: signer
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          aapt2 dump badging "$APK" | head -1
          ACTUAL=$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]')
          echo "預期：$EXPECTED_SIGNER"
          echo "實際：$ACTUAL"
          echo "actual=$ACTUAL" >> $GITHUB_OUTPUT
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            echo "::warning::未提供簽章金鑰，跳過指紋硬性比對（本次不可發布）"
            exit 0
          fi
          if [ "$ACTUAL" != "$EXPECTED_SIGNER" ]; then
            echo "::error::簽章指紋不符！預期 $EXPECTED_SIGNER，實際 $ACTUAL"
            exit 1
          fi
          echo "::notice::簽章指紋相符：$ACTUAL"

      - name: Check version against catalog
        id: guard
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "reason=未設定簽章金鑰，僅編譯驗證" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 tools/ci_guard.py --apk "$APK" --catalog catalog.json \
            --require-signer "$EXPECTED_SIGNER" ${{ inputs.force && '--force' || '' }}

      - name: Publish release and update catalog
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && steps.guard.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          NOTES="由 GitHub Actions 自動建置並發布（commit ${GITHUB_SHA::7}）"
          python3 tools/publish.py --config tools/config.json --apk "$APK" --notes "$NOTES" --yes

      - name: Summary
        if: always()
        run: |
          {
            echo "### 漫畫翻譯建置結果"
            echo ""
            echo "| 項目 | 值 |"
            echo "|---|---|"
            echo "| 簽章金鑰 | ${{ steps.keystore.outputs.signed == 'true' && '已使用正式金鑰' || '未設定（僅編譯）' }} |"
            echo "| 實際簽章指紋 | ${ACTUAL_SIGNER:-見上方步驟輸出} |"
            echo "| 版本判斷 | ${{ steps.guard.outputs.reason || '未執行' }} |"
            echo "| 是否發布 | ${{ steps.guard.outputs.publish || 'false' }} |"
          } >> $GITHUB_STEP_SUMMARY
